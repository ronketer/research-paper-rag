[project]
name = "research-paper-rag"
version = "0.1.0"
description = "Local-first RAG system for cited Q&A and comparison across research papers"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "pymupdf>=1.24.0",
    "langchain>=0.2.0",
    "langchain-text-splitters>=0.2.0",
    "chromadb>=1.5.9",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=5.6.1",
    "langchain-openai>=1.4.1",
    "gradio>=6.22.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "paper_qa"
module-root = "src"
